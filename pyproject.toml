[tool.poetry]
name = "EducAgent"
version = "0.1.0"
description = "A educational agent chatbot that teaches you causality in Socratics manner."
authors = ["Yuyang Xue <yuyang.xue@ed.ac.uk>"]
readme = "README.md"

[tool.poetry.dependencies]
python = ">=3.12,<4.0"
atomic-agents = "^2.1.0"
chromadb = "^1.0.20"
numpy = "^2.3.2"
python-dotenv = "^1.1.1"
openai = "^1.100.2"
pulsar-client = "^3.8.0"
rich = "^13.7.0"
pypdf = "^6.0.0"

[build-system]
requires = ["poetry-core>=1.0.0"]
build-backend = "poetry.core.masonry.api"